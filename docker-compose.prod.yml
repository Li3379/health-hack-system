# =============================================================================
# HHS Docker Compose Production Overrides
# =============================================================================
# Production-specific configuration for Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides base configuration for production:
#   - Automatic restart policy (restart on failure and system reboot)
#   - Resource limits (prevent runaway resource usage)
#   - Log rotation (prevent disk exhaustion)
#   - Production Spring profile for backend
#   - No exposed database/cache ports (security)
#
# MEMORY SIZING NOTE (2026-11-03)
# -------------------------------
# The production host has only 1.8 GiB RAM + 1 GiB swap and also runs a BT
# panel MySQL and zcode-cli processes. Container limits below are sized for
# that host: MySQL 384M + backend 384M + redis 96M + frontend 96M ≈ 960M,
# leaving room for host processes.
#
# `deploy.resources.limits` is IGNORED by Docker Compose outside Swarm mode.
# The functional limits are the `mem_limit` / `mem_reservation` keys below.
# Keep both in sync to avoid confusion.
# =============================================================================

services:
  # ===========================================================================
  # FRONTEND SERVICE - Production Configuration
  # ===========================================================================
  # Image: Pull from GHCR instead of building locally
  # The image tag uses environment variables for flexibility:
  #   - OWNER: GitHub repository owner (default: li3379)
  #   - IMAGE_TAG: Image version tag (default: latest)
  frontend:
    image: ghcr.io/${OWNER:-li3379}/hhs-frontend:${IMAGE_TAG:-latest}
    restart: always
    # Publish 443 alongside 80 for the self-signed TLS endpoint.
    ports:
      - "80:80"
      - "443:443"
    # Mount the nginx config and certificate instead of relying on whatever
    # was baked into the image. This lets TLS be enabled without rebuilding
    # and rebuilding images, and keeps the cert out of the image layers.
    # /opt/hhs/certs is created by scripts/gen-selfsigned-cert.sh.
    volumes:
      - ./hhs-frontend-v2/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HHS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    mem_limit: 96m
    mem_reservation: 32m
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================================================
  # BACKEND SERVICE - Production Configuration
  # ===========================================================================
  # Image: Pull from GHCR instead of building locally
  # The image tag uses environment variables for flexibility:
  #   - OWNER: GitHub repository owner (default: li3379)
  #   - IMAGE_TAG: Image version tag (default: latest)
  backend:
    image: ghcr.io/${OWNER:-li3379}/hhs-backend:${IMAGE_TAG:-latest}
    # Drop the base file's "8082:8082" mapping so the API is only reachable
    # through the nginx container. A bare `ports: []` does NOT work — Compose
    # merges list fields by appending, so the base entry survives. `!reset`
    # (Compose 2.24+) is the documented way to clear an inherited list.
    ports: !reset []
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      BASE_URL: ${BASE_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # JVM sizing for a memory-constrained host. Expanded by the Dockerfile
      # entrypoint (`sh -c "java $JAVA_OPTS -jar app.jar"`), so it takes effect
      # without rebuilding the image. Heap 256m + metaspace 128m +
      # threads/direct buffers must stay under the 384m cgroup limit; the
      # container is killed before the host-wide OOM killer is triggered.
      JAVA_OPTS: >-
        -Xms128m
        -Xmx256m
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=48m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
        -XX:+UseContainerSupport
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Shanghai
    mem_limit: 384m
    mem_reservation: 256m
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M
    # Health check runs inside the same cgroup; under memory pressure the
    # wget subprocess itself is slow to start, so widen timeout and start window
    # to avoid flapping the container to unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ===========================================================================
  # MYSQL SERVICE - Production Configuration
  # ===========================================================================
  # Note: No port override - database NOT exposed to host (security)
  mysql:
    restart: always
    # Small-host tuning. performance_schema=OFF is the single biggest win
    # (~100-150M) on MySQL 8.0; buffer pool is pinned to 128M (the image
    # default) so it cannot grow under load.
    command: >-
      mysqld
      --innodb-buffer-pool-size=128M
      --innodb-buffer-pool-instances=1
      --innodb-log-buffer-size=8M
      --performance-schema=OFF
      --max-connections=100
      --table-open-cache=400
      --skip-name-resolve
    mem_limit: 384m
    mem_reservation: 288m
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 288M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===========================================================================
  # REDIS SERVICE - Production Configuration
  # ===========================================================================
  # Note: No port override - cache NOT exposed to host (security)
  redis:
    restart: always
    # Keep the base password; add a hard memory ceiling with LRU eviction so
    # the cache cannot grow unbounded on a 1.8G host.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96m
    mem_reservation: 48m
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 48M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"