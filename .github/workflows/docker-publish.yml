# =============================================================================
# HHS Docker Publish & Auto Deploy Workflow
# =============================================================================
# Builds and pushes Docker images to GitHub Container Registry (ghcr.io)
# Automatically deploys to ECS after successful build.
#
# Trigger: Push to master branch when backend/frontend/docker-compose changes
#
# Image Tags:
#   - latest: Most recent build on master branch
#   - sha-{commit}: Traceable commit-specific tag
#
# GitHub Secrets Required:
#   - ECS_HOST: ECS server IP address
#   - ECS_USER: SSH username
#   - ECS_SSH_KEY: SSH private key
#   - ECS_DEPLOY_PATH: Project path on server (e.g., /root/hhs)
#   - GHCR_TOKEN: GitHub PAT with read:packages permission
#
#   - VITE_API_BASE_URL: Backend API URL (WITHOUT /api suffix!)
#   - VITE_WS_BASE_URL: WebSocket URL (WITHOUT /ws suffix!)
# =============================================================================

name: Build & Deploy

on:
  push:
    branches: [master]
    paths:
      - 'hhs-backend/**'
      - 'hhs-frontend-v2/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker image names must be lowercase
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/hhs-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository_owner }}/hhs-frontend

jobs:
  # ===========================================================================
  # BACKEND CI
  # ===========================================================================
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: cd hhs-backend && mvn clean verify -DskipITs

  # ===========================================================================
  # FRONTEND CI
  # ===========================================================================
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd hhs-frontend-v2 && npm install

      - name: Build frontend
        run: cd hhs-frontend-v2 && npm run build

      - name: Lint check
        run: cd hhs-frontend-v2 && npm run lint:check

      - name: Run tests
        run: cd hhs-frontend-v2 && npm run test:run

  # ===========================================================================
  # BACKEND IMAGE BUILD
  # ===========================================================================
  build-backend:
    runs-on: ubuntu-latest
    needs: [backend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (lowercase owner)
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: hhs-backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/hhs-backend:latest
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/hhs-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # FRONTEND IMAGE BUILD
  # ===========================================================================
  build-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (lowercase owner)
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: hhs-frontend-v2
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/hhs-frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/hhs-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ secrets.VITE_WS_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # DEPLOY TO ECS
  # ===========================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract metadata (lowercase owner)
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ steps.meta.outputs.owner_lc }}
          IMAGE_TAG: latest
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: OWNER,IMAGE_TAG
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ secrets.ECS_DEPLOY_PATH }}"

            # Validate deploy path exists
            echo "=== Validating deploy path: $DEPLOY_DIR ==="
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "ERROR: Deploy path '$DEPLOY_DIR' does not exist!"
              echo "Current directory contents:"
              ls -la "$(dirname "$DEPLOY_DIR" 2>/dev/null || echo '/')"
              echo ""
              echo "Searching for docker-compose.yml on server:"
              find / -name "docker-compose.yml" -path "*/hhs/*" 2>/dev/null | head -5 || true
              exit 1
            fi

            cd "$DEPLOY_DIR"
            echo "=== Working directory: $(pwd) ==="
            echo "=== Git status ==="
            git status --short 2>/dev/null || echo "Not a git repository"
            echo "=== Files present ==="
            ls -la docker-compose*.yml 2>/dev/null || echo "No docker-compose files found!"

            # Remove development override file
            rm -f docker-compose.override.yml

            # Pull latest code (non-fatal — images come from GHCR, not git)
            if [ -d .git ]; then
              echo "=== Pulling latest code ==="
              git pull origin master || echo "WARNING: git pull failed (images still pulled from GHCR)"
              rm -f docker-compose.override.yml
            fi

            # Verify schema.sql exists for DB initialization
            echo "=== Verifying schema.sql ==="
            if [ -f "./hhs-backend/src/main/resources/sql/schema.sql" ]; then
              echo "schema.sql found — will be auto-mounted to MySQL"
            else
              echo "WARNING: schema.sql not found at expected path"
              echo "Database tables may not be initialized on fresh deploy"
            fi

            # Login to GHCR for pulling images
            echo "=== Logging in to GHCR ==="
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Force pull latest images
            echo "=== Pulling latest images ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --ignore-buildable

            # Stop old containers and start new ones
            # Note: up -d returns non-zero when a dependency health check fails,
            # but we still want diagnostics. Don't let set -e abort here.
            echo "=== Recreating containers ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate || DEPLOY_FAILED=true

            # Cleanup old images
            docker image prune -f

            # Always show diagnostics, even if startup failed
            echo "=== Waiting 20s for containers to stabilize ==="
            sleep 20

            # Verify running containers
            echo "=== Container status ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            # Show backend logs for debugging
            echo "=== Backend startup logs (last 80 lines) ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=80 backend 2>/dev/null || echo "No backend logs available"

            # Check backend health directly inside Docker network
            echo "=== Internal health check ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health 2>/dev/null && echo "Backend internal health: OK" || echo "Backend internal health: FAILED"

            # Show MySQL logs if backend is unhealthy
            echo "=== MySQL logs (last 30 lines) ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=30 mysql 2>/dev/null || echo "No MySQL logs available"

            # Exit with error if deploy failed
            if [ "${DEPLOY_FAILED:-false}" = "true" ]; then
              echo "ERROR: Container startup failed — see logs above"
              exit 1
            fi

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 30
          for i in $(seq 1 6); do
            echo "Health check attempt $i/6..."
            if curl -sf http://${{ secrets.ECS_HOST }}/actuator/health; then
              echo "Deployment successful - backend is healthy"
              exit 0
            fi
            echo "Backend not ready, waiting 15s..."
            sleep 15
          done
          echo "ERROR: Backend health check failed after 6 attempts (120s)"
          exit 1
